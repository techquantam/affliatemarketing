server.port=${SERVER_PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/affiliate-app}
spring.data.mongodb.database=${MONGODB_DATABASE:affiliate-app}

app.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/affiliate-app}
app.mongodb.database=${MONGODB_DATABASE:affiliate-app}

app.jwt.secret=${JWT_SECRET:default_jwt_secret_key_cyvanta_2026_super_secure_32bytes}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:1234567890}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo_secret}
cloudinary.folder=${CLOUDINARY_FOLDER:affiliate-app}

google.client-id=${GOOGLE_CLIENT_ID:google_client_id_placeholder}
google.client-secret=${GOOGLE_CLIENT_SECRET:google_client_secret_placeholder}

app.cors.origins=${APP_CORS_ORIGINS:*}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

server.forward-headers-strategy=native

admitad.client-id=${ADMITAD_CLIENT_ID:admitad_client_id_placeholder}
admitad.client-secret=${ADMITAD_CLIENT_SECRET:admitad_client_secret_placeholder}

# Email Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:dev@cyvanta.com}
spring.mail.password=${MAIL_PASSWORD:dev_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SMS Configuration — MessageCentral VerifyNow
sms.provider=${SMS_PROVIDER:messagecentral}

# MessageCentral (static auth token from console → Developer Guide → API Credentials)
sms.messagecentral.customer-id=${MESSAGECENTRAL_CUSTOMER_ID:}
sms.messagecentral.auth-token=${MESSAGECENTRAL_AUTH_TOKEN:}
sms.messagecentral.country-code=${MESSAGECENTRAL_COUNTRY_CODE:91}